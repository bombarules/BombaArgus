<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bomba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Outfit:wght@300;500&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#03050c; --ink:#e6ecf7; --ink-dim:#93a1bc; --glass:rgba(12,18,38,.62); --edge:rgba(240,178,90,.3); --accent:#f0b25a; --cyan:#5fe0f0; --violet:#a77bff;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --stage:#03050c; --ink:#e6ecf7; } }
:root[data-theme="dark"]{ --stage:#03050c; --ink:#e6ecf7; }
html,body{height:100%;margin:0;overflow:hidden;background:var(--stage);color:var(--ink);font-family:"Outfit",system-ui,sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.sw{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:56px;height:32px;padding:0;border-radius:16px;
  background:rgba(12,18,38,.65);border:1px solid var(--edge);cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sw .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#1c2640;display:grid;place-items:center;transition:transform .25s,background .25s}
.sw svg{width:15px;height:15px;fill:none;stroke:var(--ink-dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sw[aria-pressed="true"]{background:rgba(240,178,90,.22);border-color:var(--accent)}
.sw[aria-pressed="true"] .knob{transform:translateX(24px);background:var(--accent)}
.sw[aria-pressed="true"] svg{stroke:#0a0f1f}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.label{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);transform:translate(-50%,8px);text-align:center;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;width:80%}
.label.on{opacity:1;transform:translate(-50%,0)}
.label b{display:block;font-family:"Fraunces",serif;font-weight:400;font-size:22px;color:#ffd9a0}
.label a{display:none;margin:8px auto 0;width:max-content;padding:9px 22px;border-radius:999px;background:rgba(240,178,90,.18);border:1px solid var(--accent);color:var(--ink);font-size:15px;text-decoration:none;pointer-events:auto}
.label a.on{display:block}
.label a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.label span{font-size:13px;color:var(--ink-dim);font-weight:300}
 .rbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:36px;height:36px;padding:0;border-radius:50%;background:rgba(12,18,38,.65);border:1px solid var(--edge);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rbtn svg{width:18px;height:18px;fill:none;stroke:var(--ink-dim);stroke-width:1.8;stroke-linecap:round}
.rbtn:focus-visible,.recents button:focus-visible,.recents a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.recents{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);max-height:60%;overflow:auto;padding:14px 16px;border-radius:20px;background:rgba(8,12,28,.92);border:1px solid var(--edge);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.rhead b{font-family:"Fraunces",serif;font-weight:400;font-size:19px;color:#ffd9a0}
.rhead button{background:none;border:0;color:var(--ink-dim);font-size:16px;padding:6px 8px;cursor:pointer}
.rbtns{display:flex;align-items:center;gap:6px}
#rtrash svg{width:19px;height:19px;fill:none;stroke:var(--ink-dim);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
#rtrash[hidden]{display:none}
html,body{background:#140f16}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid rgba(240,178,90,.12);color:var(--ink);text-decoration:none}
.rrow img{width:34px;height:34px;flex:0 0 auto}
.rrow .tx{flex:1;min-width:0}.rrow .t{display:block;font-size:15px}.rrow .d{font-size:12px;color:var(--ink-dim);font-weight:300}
.rrow .go{font-size:13px;color:var(--accent)}
.rnone{color:var(--ink-dim);font-size:14px;font-weight:300;padding:10px 4px}
.handle{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 4px);width:44px;height:5px;padding:0;border:0;border-radius:3px;background:rgba(240,178,90,.35);cursor:pointer}
.drawer,.drawer *{box-sizing:border-box}
.drawer{position:fixed;inset:0;z-index:20;background:rgba(3,5,12,.97);padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;flex-direction:column;animation:dup .25s ease-out}
.drawer[hidden]{display:none}
@keyframes dup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.dtop{display:flex;gap:10px;align-items:center;width:100%}
.dtop input{flex:1 1 auto;min-width:0;width:100%;font:300 16px "Outfit",sans-serif;color:var(--ink);background:rgba(240,178,90,.08);border:1px solid var(--edge);border-radius:999px;padding:11px 16px;outline:none}
.dtop input:focus{border-color:var(--accent)}
.dtop button{flex:0 0 auto;width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:17px;color:var(--ink-dim);background:none;border:1px solid var(--edge);border-radius:50%;cursor:pointer}
.dtoggle{display:flex;align-items:center;justify-content:space-between;width:100%;margin:12px 0 0;min-height:44px;padding:0 14px;font:400 14px "Outfit",sans-serif;color:var(--ink-dim);background:none;border:1px solid var(--edge);border-radius:14px;cursor:pointer}
.dtoggle svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.dtoggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.dtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dacts[hidden]{display:none!important}
.dacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 4px}
.dacts button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 10px;font:400 14px "Outfit",sans-serif;color:var(--ink);background:rgba(240,178,90,.07);border:1px solid var(--edge);border-radius:14px;cursor:pointer}
.dacts button:active{background:rgba(240,178,90,.16)}
.dacts svg{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:var(--accent);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dacts span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dacts .wide{grid-column:1/-1}
.dgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 4px;margin-top:10px;padding:10px 0 30px;align-content:start;border-top:1px solid rgba(240,178,90,.12)}
.dapp{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;color:var(--ink);font:300 12px "Outfit",sans-serif;cursor:pointer;padding:4px}
.dapp img{width:52px;height:52px}
.dapp img{width:min(52px,15vw);height:min(52px,15vw)}
.dapp span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dnone{grid-column:1/-1;text-align:center;color:var(--ink-dim);font-weight:300}
.drawer button:focus-visible,.dtop input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.liveov{position:fixed;inset:0;z-index:30;background:#02040a;display:flex;flex-direction:column}
.liveov[hidden]{display:none}
.liveov.zoom{animation:lvzoom .28s cubic-bezier(.2,.8,.2,1)}
@keyframes lvzoom{from{transform:scale(.35);opacity:0;border-radius:40px}to{transform:none;opacity:1}}
.liveov video{flex:1;min-height:0;width:100%;object-fit:contain;background:#02040a}
.lvbar{display:flex;align-items:center;gap:12px;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.lvbar b{flex:1;font:400 18px "Fraunces",serif;color:#ffd9a0}
.lvbar button{width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:none;color:var(--ink);font-size:17px;cursor:pointer}
.dlive{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:1px solid var(--edge);border-radius:14px;background:rgba(240,178,90,.04)}
.dlive .lvt{grid-column:1/-1;display:flex;align-items:center;gap:8px;font:400 15px "Fraunces",serif;color:#ffd9a0}
.dlive .lvt svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:1.7}
.dlive select,.dlive button{min-height:44px;font:400 14px "Outfit",sans-serif;color:var(--ink);background:#070b18;border:1px solid var(--edge);border-radius:12px;padding:0 10px;width:100%;min-width:0}
.dlive #lvCode{grid-column:1/-1;letter-spacing:.06em}
.dlive #lvShare.on{background:#c46b6b;border-color:#c46b6b;color:#fff}
.dlive #lvStat{grid-column:1/-1;margin:0;font-size:12px;color:var(--ink-dim);min-height:1em}
.dlive select:focus-visible,.dlive button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.askbox,.askbox *{box-sizing:border-box}
.askbox{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(2,4,10,.6);padding:20px}
.askbox[hidden]{display:none}
.askcard{display:flex;align-items:center;gap:10px;width:min(340px,100%);padding:14px;border-radius:20px;background:#0c1226;border:1px solid var(--edge);box-shadow:0 10px 40px rgba(0,0,0,.5)}
.askcard input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--edge);background:#070b18;color:var(--ink);font:400 17px "Outfit",sans-serif;outline:none}
.askcard input.code{text-align:center;letter-spacing:.14em;text-transform:uppercase;font-size:19px}
.askcard input:focus{border-color:var(--accent)}
.askcard button{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--edge);background:none;color:var(--ink-dim);font-size:17px;cursor:pointer}
.askcard #askOk{background:var(--accent);border-color:var(--accent);color:#0a0f1f}
.askcard button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.liveov video{position:absolute;inset:0;width:100%;height:100%}
.liveov .lvbar{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(2,4,10,.85));opacity:0;transition:opacity .3s;pointer-events:none}
.liveov.bar .lvbar{opacity:1;pointer-events:auto}
.liveov{padding:0}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}.label,.sw .knob{transition:none}}
.divefx{position:fixed;inset:0;pointer-events:none;z-index:15;opacity:0;transition:opacity .7s ease-in;
  background:radial-gradient(circle at 50% 50%,rgba(255,214,150,.0) 0%,rgba(240,178,90,.55) 38%,rgba(3,5,12,1) 78%)}
.divefx.on{opacity:1}
@media (prefers-reduced-motion: reduce){.divefx{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="App icons floating in a sphere in space. Tap one to open it."></canvas>
<button class="handle" id="dHandle" aria-label="All phone apps"></button>

 <div class="dtop"><input id="dSearch" type="search" placeholder="Search apps" autocomplete="off"><button id="dClose" aria-label="Close">✕</button></div>
 <button class="dtoggle" id="dToggle" aria-expanded="false" aria-controls="dActs"><span>Settings &amp; live screens</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
 <div class="dacts" id="dActs" hidden>
  <button id="dWall"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 15l3-3 2 2 3-3"/><circle cx="9" cy="8" r="1.3"/></svg><span>Wallpaper</span></button>
  <button id="dHome"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/></svg><span>Home screen</span></button>

   <div class="lvt"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="8.5" height="6.5" rx="1.5"/><rect x="13" y="4" width="8.5" height="6.5" rx="1.5"/><rect x="2.5" y="13" width="8.5" height="6.5" rx="1.5"/><rect x="13" y="13" width="8.5" height="6.5" rx="1.5"/></svg>Live screens on the ball</div>
   <button id="lvCode"></button>
   <select id="lvMe" aria-label="This device"></select>
   <button id="lvShare">Share this phone</button>
   <p id="lvStat" role="status"></p>
  </div>
 </div>
 <div class="dgrid" id="dGrid"><div class="dnone">Loading apps…</div></div>
</div>
<button class="rbtn" id="rbtn" aria-label="Recently opened apps"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
<div class="recents" id="recents" hidden><div class="rhead"><b>Recently opened</b><span class="rbtns"><button id="rtrash" aria-label="Delete recents"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 12.5h9l1-12.5M10 11v5.5M14 11v5.5"/></svg></button><button id="rclose" aria-label="Close recents">✕</button></span></div><div id="rlist"></div></div>
<div class="askbox" id="askBox" hidden role="dialog" aria-modal="true" aria-label="Enter"><div class="askcard"><button id="askNo" aria-label="Cancel">✕</button><input id="askIn" autocomplete="off" spellcheck="false"><button id="askOk" aria-label="OK">✓</button></div></div><div class="liveov" id="liveOv" hidden role="dialog" aria-label="Live screen"><video id="liveVid" playsinline muted autoplay></video><div class="lvbar"><b id="liveName"></b><button id="liveClose" aria-label="Close">✕</button></div></div>
<div class="label" id="label" role="status"><b id="lb-t"></b><a id="lb-a" target="_top">Open</a><span id="lb-d"></span></div>

<script src="three.min.js"></script>
<script src="peerjs.min.js"></script>
<script>
(function(){
const APPS=[
 {n:"AquaticsTechApp",i:"wave",c:"#9cc5bf",url:"apps/aquatics-tech.html"},
 {n:"WinterizingPoolEquipment",i:"flake",c:"#b6c4d6",url:""},
 {n:"PropertyResource",i:"house",c:"#d9bb92",url:"apps/parks-map.html"},
 {n:"FieldReportApp",i:"clip",c:"#abc4a4",url:"apps/field-reports.html"},
 {n:"EmployeeCommunityBook",i:"book",c:"#e2aba3",url:""},
 {n:"OddsApp",i:"dice",c:"#e5c48a",url:""},
 {n:"SnowKnows",i:"cloud",c:"#d6cbe2",url:""},
 {n:"Wheelscache",i:"wheel",c:"#e6b9a4",url:""}
];
const split=s=>s.replace(/([a-z])([A-Z])/g,"$1 $2");

const ICON={
 wave(c){for(let k=-1;k<=1;k++){c.beginPath();for(let x=-120;x<=120;x+=4){const y=k*62+Math.sin(x/30)*20;x===-120?c.moveTo(x,y):c.lineTo(x,y);}c.stroke();}},
 flake(c){for(let k=0;k<6;k++){c.save();c.rotate(k*Math.PI/3);c.beginPath();c.moveTo(0,0);c.lineTo(0,-125);c.moveTo(0,-70);c.lineTo(-30,-100);c.moveTo(0,-70);c.lineTo(30,-100);c.stroke();c.restore();}},
 house(c){c.beginPath();c.moveTo(-125,-5);c.lineTo(0,-115);c.lineTo(125,-5);c.moveTo(-90,-35);c.lineTo(-90,115);c.lineTo(90,115);c.lineTo(90,-35);c.stroke();c.beginPath();c.moveTo(-28,115);c.lineTo(-28,40);c.lineTo(28,40);c.lineTo(28,115);c.stroke();},
 clip(c){c.beginPath();c.roundRect?c.roundRect(-90,-110,180,235,22):c.rect(-90,-110,180,235);c.stroke();c.beginPath();c.moveTo(-40,-110);c.lineTo(-40,-135);c.lineTo(40,-135);c.lineTo(40,-110);c.stroke();
   c.beginPath();c.moveTo(-50,10);c.lineTo(-12,48);c.lineTo(55,-30);c.stroke();},
 book(c){c.beginPath();c.moveTo(0,-80);c.quadraticCurveTo(-60,-115,-130,-90);c.lineTo(-130,95);c.quadraticCurveTo(-60,70,0,105);c.quadraticCurveTo(60,70,130,95);c.lineTo(130,-90);c.quadraticCurveTo(60,-115,0,-80);c.lineTo(0,105);c.stroke();},
 dice(c){c.beginPath();c.roundRect?c.roundRect(-115,-115,230,230,40):c.rect(-115,-115,230,230);c.stroke();[[-55,-55],[55,55],[0,0],[55,-55],[-55,55]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,18,0,7);c.fill();});},
 wheel(c){c.beginPath();c.arc(0,0,120,0,7);c.stroke();c.beginPath();c.arc(0,0,32,0,7);c.stroke();for(let k=0;k<6;k++){const a=k*Math.PI/3;c.beginPath();c.moveTo(Math.cos(a)*32,Math.sin(a)*32);c.lineTo(Math.cos(a)*120,Math.sin(a)*120);c.stroke();}},
 cloud(c){c.beginPath();c.moveTo(-95,10);c.arc(-70,-25,40,Math.PI*.6,Math.PI*1.5);c.arc(5,-55,62,Math.PI*1.1,Math.PI*1.95);c.arc(78,-15,42,Math.PI*1.4,Math.PI*.45);c.closePath();c.stroke();
   [[-60,70],[0,95],[60,70],[-30,130],[30,130]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,12,0,7);c.fill();});}
};
function drawTile(ctx,a,sel){
  const S=512;ctx.clearRect(0,0,S,S);
  const g=ctx.createLinearGradient(0,0,S,S);g.addColorStop(0,"#2c2129");g.addColorStop(1,"#1e171d");
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect?ctx.roundRect(16,16,S-32,S-32,48):ctx.rect(16,16,S-32,S-32);ctx.fill();
  ctx.save();ctx.shadowColor=a.c;ctx.shadowBlur=sel?40:22;ctx.strokeStyle=a.c;ctx.lineWidth=sel?12:7;
  ctx.beginPath();ctx.roundRect?ctx.roundRect(30,30,S-60,S-60,38):ctx.rect(30,30,S-60,S-60);ctx.stroke();ctx.restore();
  ctx.save();ctx.translate(S/2,S/2);ctx.strokeStyle=a.c;ctx.fillStyle=a.c;ctx.lineWidth=20;ctx.lineCap="round";ctx.lineJoin="round";
  ICON[a.i](ctx);ctx.restore();
}

const cv=document.getElementById("c");
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1,.1,300);

/* Argus space: void black into deep navy, a violet drift and an amber glow far away */
S.add(new THREE.Mesh(new THREE.SphereGeometry(120,32,32),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,
vertexShader:`varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
fragmentShader:`varying vec3 vP;
float h2(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
void main(){vec3 d=normalize(vP);
 vec3 col=mix(vec3(.008,.012,.03),vec3(.03,.045,.10),smoothstep(-1.,1.,d.y)*.9);
 col+=vec3(.16,.09,.30)*pow(max(dot(d,normalize(vec3(.75,-.25,-.6))),0.),5.)*.5;
 col+=vec3(.30,.17,.05)*pow(max(dot(d,normalize(vec3(-.65,.4,-.65))),0.),9.)*.35;
 col+=(h2(gl_FragCoord.xy)-.5)/255.;
 gl_FragColor=vec4(col,1.);}`})));
const sp=new Float32Array(2400);for(let i=0;i<800;i++){const v=new THREE.Vector3(Math.random()-.5,Math.random()-.5,Math.random()-.5).normalize().multiplyScalar(60+Math.random()*50);sp.set([v.x,v.y,v.z],i*3);}
const SG=new THREE.BufferGeometry();SG.setAttribute("position",new THREE.BufferAttribute(sp,3));
S.add(new THREE.Points(SG,new THREE.PointsMaterial({size:.2,color:0xcfe0ff,transparent:true,opacity:.65})));

/* truncated icosahedron (soccer ball): 32 panels, each app fills its whole panel */
const PHI=(1+Math.sqrt(5))/2,raw=[];
const cyc=(a,b,c)=>{raw.push([a,b,c],[c,a,b],[b,c,a]);};
for(const sa of[1,-1])for(const sb of[1,-1]){cyc(0,sa,sb*3*PHI);}
for(const sa of[1,-1])for(const sb of[1,-1])for(const sc of[1,-1]){cyc(sa,sb*(2+PHI),sc*2*PHI);cyc(sa*PHI,sb*2,sc*(2*PHI+1));}
const V=[];raw.forEach(p=>{const v=new THREE.Vector3(...p);if(!V.some(u=>u.distanceTo(v)<1e-6))V.push(v);});
const SC=1.85/V[0].length();V.forEach(v=>v.multiplyScalar(SC));
const EL=2*SC,edges=[];
for(let i=0;i<V.length;i++)for(let j=i+1;j<V.length;j++)if(Math.abs(V[i].distanceTo(V[j])-EL)<1e-4)edges.push([i,j]);
const rig=new THREE.Group();S.add(rig);
S.add(new THREE.HemisphereLight(0xf3e3d3,0x2a1f27,.9));

  dSearch.value="";if(phoneApps)drawApps();BombaNative.requestApps();}

(function(){const t=document.getElementById("dToggle"),a=document.getElementById("dActs");
  const set=open=>{t.setAttribute("aria-expanded",open);a.hidden=!open;try{localStorage.setItem("bomba-drawer-open",open?"1":"0")}catch(e){}};
  let open=false;try{open=localStorage.getItem("bomba-drawer-open")==="1"}catch(e){}set(open);t.onclick=()=>set(a.hidden);})();
window.bombaHome=function(){if(window.closeLive)closeLive();closeDrawer();document.getElementById("recents").hidden=true;select(-1);};
dSearch.oninput=drawApps;
document.getElementById("dHandle").onclick=openDrawer;
document.getElementById("dClose").onclick=closeDrawer;
document.getElementById("dWall").onclick=()=>{closeDrawer();BombaNative.pickWallpaper();};
document.getElementById("dHome").onclick=()=>{closeDrawer();BombaNative.homeSettings();};

let dY=0;drawer.addEventListener("touchstart",e=>{dY=e.touches[0].clientY},{passive:true});
drawer.addEventListener("touchend",e=>{if(dGrid.scrollTop<=0&&e.changedTouches[0].clientY-dY>110)closeDrawer();},{passive:true});
if(!window.BombaNative)document.getElementById("dHandle").hidden=true;

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const clock=new THREE.Clock();let sy=0,sp2=0,t=0;
(function loop(){
  const dt=Math.min(clock.getDelta(),.05);t+=dt;
  if(!drag){vy*=.94;vp*=.9;yaw+=vy;pitch=THREE.MathUtils.clamp(pitch+vp,-.9,1.1);}
  sy+=(gx-sy)*.08;sp2+=(gy-sp2)*.08;
  if(focus!==null)rig.rotation.y+=(focus-rig.rotation.y)*.08;else rig.rotation.y+=dt*.18;
  if(!reduce)APPS.forEach(a=>{const k=APPS.indexOf(a)===sel;const s=THREE.MathUtils.lerp(a.group.position.length()/a.base.length(),k?1.18:1,.1);a.group.position.copy(a.base).multiplyScalar(s);a.group.scale.setScalar(THREE.MathUtils.lerp(a.group.scale.x,k?1.25:1,.1));});
  zoom+=(zoomTo-zoom)*(diving?.075:.045);if(pitchTo!==null)pitch+=(pitchTo-pitch)*.08;
  const Y=yaw+sy,Pt=pitch+sp2,D=dist*zoom;
  cam.position.set(Math.sin(Y)*Math.cos(Pt)*D,Math.sin(Pt)*D,Math.cos(Y)*Math.cos(Pt)*D);cam.lookAt(0,0,0);
  R.render(S,cam);requestAnimationFrame(loop);
})();
})();
</script>
